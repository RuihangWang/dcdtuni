[package]
version = "9.0.0" # Semantic Versioning is used: https://semver.org/

# These fields are used primarily for display in the UI.
title = "Kit Livestream Application"
description = "Streams the entire application framebuffer."
category = "Livestream"
keywords = ["livestream", "streaming"]
icon = "data/icon.png"
preview_image = "data/preview.png"
changelog = "docs/CHANGELOG.md"
readme  = "docs/Overview.md"
authors = ["NVIDIA"]
repository = ""

# Define all the direct dependencies for this extension.
[dependencies]
"omni.kit.livestream.webrtc" = {}
"omni.kit.renderer.core" = {}

# Restrict to the Kit version used to build (and higher).
[package.writeTarget]
kit = true

# Define the Python modules that this extension provides.
# C++ only extensions need this just so tests don't fail.
[[python.module]]
name = "omni.kit.livestream.app"

# Define the native plugins that this extension provides.
[[native.plugin]]
path = "bin/*.plugin"

# Define the documentation generated from this extension.
[documentation]
pages = ["docs/Overview.md", "docs/CHANGELOG.md"]

# Default values for settings required by this extension.
[settings]

# Default values for settings applied to the primary application stream.
[settings.exts."omni.kit.livestream.app".primaryStream]
allowDynamicResize = false  # Allow dynamic resizing of the video stream? May be detrimental to overall streaming performance. Not supported if spectator streams are used.
enableEventTracing = true   # Enable event trace logging for this stream? These can be used to diagnose issues with the stream, but can grow quite large and use disk space.
enableOpenTelemetry = false # Enable/emit open telemetry for this stream? Set OMNI_OTEL_METRICS_FILE_PATH env var or observability/metrics/file/path setting to output path.
publicIp = ""               # Fixed ip used to transport streaming media. Can help for connecting when server is behind a NAT.
signalPort = 49100          # TCP port used for negotiating a connection. Must be unique for each stream, if not specified an attempt will be made to use an unoccupied port.
streamPort = 47998          # UDP port used to transport streaming media. Must be unique for each stream, if not specified an attempt will be made to use an unoccupied port.
streamType = "webrtc"       # Type of streaming implementation to create. webrtc=standard WebRTC protocol, native=proprietary. Must be defined for the stream to be created.
targetFps = 60              # The target frames per second of the stream. May be adjusted in response to quality of service (QoS) feedback to improve streaming performance.

# Default values for settings applied to the first spectator application stream.
#[[settings.exts."omni.kit.livestream.app".spectatorStream]]
#streamType = "webrtc"       # Type of streaming implementation to create. webrtc=standard WebRTC protocol, native=proprietary. Must be defined for the stream to be created.
#signalPort = 49200          # TCP port used for negotiating a connection. Must be unique for each stream, if not specified an attempt will be made to use an unoccupied port.
#streamPort = 48000          # UDP port used to transport streaming media. Must be unique for each stream, if not specified an attempt will be made to use an unoccupied port.

# Additional spectator application streams can be specified using multiple array entries.
#[[settings.exts."omni.kit.livestream.app".spectatorStream]]
#streamType = "webrtc"
#signalPort = 49210
