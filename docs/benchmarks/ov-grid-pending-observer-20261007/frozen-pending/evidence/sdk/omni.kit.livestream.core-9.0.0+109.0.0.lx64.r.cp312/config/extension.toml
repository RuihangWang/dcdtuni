[package]
version = "9.0.0" # Semantic Versioning is used: https://semver.org/

# These fields are used primarily for display in the UI.
title = "Kit Livestream Core"
description = "Streaming server factory."
category = "Livestream"
keywords = ["livestream", "streaming"]
icon = "data/icon.png"
preview_image = "data/preview.png"
changelog = "docs/CHANGELOG.md"
readme  = "docs/Overview.md"
authors = ["NVIDIA"]
repository = ""

# Define all the direct dependencies for this extension.
[dependencies]

# Restrict to the Kit version used to build (and higher).
[package.writeTarget]
kit = true

# Define the Python modules that this extension provides.
# C++ only extensions need this just so tests don't fail.
[[python.module]]
name = "omni.kit.livestream.core"

# Define the native plugins that this extension provides.
[[native.plugin]]
path = "bin/*.plugin"

# Define any test specific properties for this extension.
[[test]]
cppTests.libraries = ["bin/${lib_prefix}omni.kit.livestream.core.tests${lib_ext}"]

# Define the documentation generated from this extension.
[documentation]
pages = ["docs/Overview.md", "docs/CHANGELOG.md"]

# Default values for settings required by this extension.
[settings]

# App setting values required for streaming.
app.rendergraph.maxFramesInFlight = 2
app.renderer.sleepMsOutOfFocus = 0
app.runLoops.main.rateLimitEnabled = true
app.runLoops.main.rateLimitFrequency = 60
app.runLoops.main.rateLimitUsePrecisionSleep = true
app.runLoops.main.syncToPresent = true
app.runLoops.present.rateLimitEnabled = true
app.runLoops.present.rateLimitFrequency = 60
app.runLoops.present.rateLimitUsePrecisionSleep = true
app.runLoops.rendering_0.rateLimitEnabled = true
app.runLoops.rendering_0.rateLimitFrequency = 60
app.runLoops.rendering_0.rateLimitUsePrecisionSleep = true
app.runLoops.rendering_0.syncToPresent = true
app.runLoops.rendering_1.rateLimitEnabled = true
app.runLoops.rendering_1.rateLimitFrequency = 60
app.runLoops.rendering_1.rateLimitUsePrecisionSleep = true
app.runLoops.rendering_1.syncToPresent = true
app.runLoopsGlobal.syncToPresent = true
app.viewport.defaults.tickRate = 60
app.vsync = false

# Core renderer setting values required for streaming.
exts."omni.kit.renderer.core".parallelStartup.enabled = false
exts."omni.kit.renderer.core".present.displays.limit = "" # Do not limit present thread to the display refresh rate.
exts."omni.kit.renderer.core".present.enabled = true
exts."omni.kit.renderer.core".present.presentAfterRendering = true
