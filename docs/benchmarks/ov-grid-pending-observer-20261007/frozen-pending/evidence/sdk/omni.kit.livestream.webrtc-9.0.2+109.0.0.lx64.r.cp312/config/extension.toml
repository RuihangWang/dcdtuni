[package]
version = "9.0.2" # Semantic Versioning is used: https://semver.org/

# These fields are used primarily for display in the UI.
title = "Kit Livestream WebRTC Server"
description = "Streams provided frames to a WebRTC client."
category = "Livestream"
keywords = ["livestream", "streaming", "streamsdk", "webrtc"]
icon = "data/icon.png"
preview_image = "data/preview.png"
changelog = "docs/CHANGELOG.md"
readme  = "docs/Overview.md"
authors = ["NVIDIA"]
repository = ""

# Define all the direct dependencies for this extension.
[dependencies]
"omni.kit.livestream.core" = {}

# Restrict to the Kit version used to build (and higher).
[package.writeTarget]
kit = true

# Define the Python modules that this extension provides.
# C++ only extensions need this just so tests don't fail.
[[python.module]]
name = "omni.kit.livestream.webrtc"

# Define the native plugins that this extension provides.
[[native.plugin]]
path = "bin/omni.kit.livestream.webrtc.plugin"

# Define any test specific properties for this extension.
[[test]]
args = ["--/log/channels/omni.kit.livestream.streamsdk=error"] # Suppress superfluous StreamSDK logs.
cppTests.libraries = ["bin/${lib_prefix}omni.kit.livestream.webrtc.tests${lib_ext}"]
dependencies = ["carb.windowing.plugins", "omni.kit.clipboard"]

# Define the documentation generated from this extension.
[documentation]
pages = ["docs/Overview.md", "docs/CHANGELOG.md"]

# Default values for settings required by this extension.
[settings]
log.channels."omni.kit.livestream.streamsdk" = "error" # Log level for the StreamSDK specific log channel.
