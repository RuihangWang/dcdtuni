<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c2f37"/><stop offset="1" stop-color="#15161a"/>
    </linearGradient>
    <linearGradient id="sideB" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1e6bff"/>
      <stop offset="0.5" stop-color="#16c6ff"/>
      <stop offset="1" stop-color="#76e06a"/>
    </linearGradient>
    <linearGradient id="topB" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffb02e"/>
      <stop offset="1" stop-color="#ff3b2f"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgB)"/>
  <!-- top face (hot) -->
  <polygon points="32,11 51,22 32,33 13,22" fill="url(#topB)"/>
  <!-- left face -->
  <polygon points="13,22 32,33 32,53 13,42" fill="url(#sideB)"/>
  <!-- right face (shaded) -->
  <polygon points="51,22 32,33 32,53 51,42" fill="url(#sideB)"/>
  <polygon points="51,22 32,33 32,53 51,42" fill="#000000" opacity="0.12"/>
  <!-- wireframe -->
  <g stroke="#7cc4ff" stroke-width="1.6" fill="none" stroke-linejoin="round" opacity="0.9">
    <polygon points="32,11 51,22 32,33 13,22"/>
    <polyline points="13,22 13,42 32,53 51,42 51,22"/>
    <line x1="32" y1="33" x2="32" y2="53"/>
  </g>
</svg>
