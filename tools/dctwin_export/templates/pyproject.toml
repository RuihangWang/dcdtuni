[tool.poetry]
name = "dctwin"
version = "5.0.0"
description = "Data-centre design evaluator: .cfdproj -> OpenFOAM air / liquid-cooling DAE -> design metrics."
authors = ["Li Tianyu", "Nyguang Houanghuy", "Wang Ruihang", "Cao Zhiwei", "Lin Feng", "Yang Miao"]
packages = [
    {include = "backend", from = "src"},
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
jinja2 = "3.1.2"
markupsafe = "2.0.1"
loguru = "*"
pydantic = ">=2.0"
numpy = "<2.0.0"
vtk = "9.5.1"
pyvista = "^0.47.1"
websockets = ">=12.0"
matplotlib = ">=3.7.0"
openpyxl = "^3.1.5"
pytest = {version = ">=8.0", optional = true}

[tool.poetry.extras]
dev = ["pytest"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
