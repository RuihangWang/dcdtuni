[tool.poetry]
name = "dc-evaluator"
version = "5.0.0"
description = "Data-centre design evaluator: .cfdproj -> cut-cell mesh -> GPU Newton-Krylov or OpenFOAM air solve / liquid-cooling DAE -> design metrics."
authors = ["Li Tianyu", "Nyguang Houanghuy", "Wang Ruihang", "Cao Zhiwei", "Lin Feng", "Yang Miao"]
packages = [
    {include = "backend", from = "src"},
    {include = "dceval", from = "src"},
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
jinja2 = "3.1.2"
markupsafe = "2.0.1"
loguru = "*"
pydantic = ">=2.0"
numpy = "<2.0.0"
vtk = "9.5.1"
pyvista = "^0.47.1"
matplotlib = ">=3.7.0"
openpyxl = "^3.1.5"
pytest = {version = ">=8.0", optional = true}
# the GPU air solver (src/backend/aircooling/gpu_solver), next to torch, scipy and torch-geometric (setup_env.sh)
warp-lang = {version = "1.18.0", optional = true}
pyamg = {version = ">=5.0,<6", optional = true}
h5py = {version = ">=3.9", optional = true}
tomli = {version = ">=2.0", python = "<3.11", optional = true}
tomlkit = {version = ">=0.12", optional = true}

[tool.poetry.extras]
dev = ["pytest"]
gpu-solver = ["warp-lang", "pyamg", "h5py", "tomli", "tomlkit"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
